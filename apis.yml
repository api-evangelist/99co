name: 99.co
description: >-
  99.co (99 Group) is a Singapore-headquartered real estate technology company
  and one of the largest property marketplaces in Southeast Asia. Founded in 2014
  by Darius Cheung, Yan Phun and Conor McLaughlin, it operates consumer property
  portals across Singapore and Indonesia, including 99.co and SRX.com.sg in
  Singapore and 99.co/id and Rumah123.com in Indonesia. The platform lets buyers,
  renters and agents search HDB resale flats, executive condos, condominiums,
  landed homes and new-launch projects for sale and rent, with map-based search,
  transaction data, agent directories, mortgage tools and nearby-amenity insights
  (MRT, schools, commute times). 99 Group is backed by investors including Sequoia
  Capital, 500 Global, Golden Gate Ventures, Quest Ventures and East Ventures.
  This profile was surfaced as a 500 Global portfolio company and enriched by the
  API Evangelist pipeline; 99.co exposes consumer web products but publishes no
  first-party public developer API or portal at this time.
